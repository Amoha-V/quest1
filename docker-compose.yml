services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: frame_finder
      POSTGRES_PASSWORD: frame_finder
      POSTGRES_DB: frame_finder
    ports:
      - "5432:5432"
    volumes:
      - frame_finder_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - frame_finder_minio:/data

volumes:
  frame_finder_pg:
  frame_finder_minio:
